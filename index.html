<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Globe</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>
    <script>
        const canvas = document.getElementById('globeCanvas');
        const gl = canvas.getContext('webgl');

        // Adjust the canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Set up lighting and material properties
        const lightColor = [1.0, 1.0, 1.0]; // White light
        const ambientLight = [0.1, 0.1, 0.1]; // Low ambient light

        // Load textures for the globe
        const textureLoader = new TextureLoader();
        const earthTexture = textureLoader.load('path/to/earth_texture.jpg');
        const normalMap = textureLoader.load('path/to/normal_map.jpg');
        const specularMap = textureLoader.load('path/to/specular_map.jpg');
        const cloudTexture = textureLoader.load('path/to/cloud_texture.png');

        // Create globe geometry
        const globeGeometry = new SphereGeometry(1, 64, 64);
        const globeMaterial = new ShaderMaterial({
            uniforms: {
                lightColor: { value: new Vector3(...lightColor) },
                ambientLight: { value: new Vector3(...ambientLight) },
                earthTexture: { value: earthTexture },
                normalMap: { value: normalMap },
                specularMap: { value: specularMap },
                cloudTexture: { value: cloudTexture }
            },
            vertexShader: vertexShaderSource,
            fragmentShader: fragmentShaderSource
        });

        const globeMesh = new Mesh(globeGeometry, globeMaterial);
        scene.add(globeMesh);

        // Optimize rendering
        function render() {
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            // Update globe rotation
            globeMesh.rotation.y -= 0.01;
            renderer.render(scene, camera);
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
